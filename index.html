<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>스핔이 라이브 배경화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171a33; --surface:#232850; --line:#3a4080; --text:#f2f0fb; --muted:#a9acd0;
  --mint:#8fe3cf; --peach:#ffb7a5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 85% -10%,#2c3270 0,transparent 70%),var(--bg);
  color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:960px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:900;letter-spacing:-.01em;font-size:clamp(32px,7vw,54px);line-height:1.15;margin:0 0 12px}
h1 span{color:var(--mint)}
h2{font-size:18px;margin:36px 0 12px}
.lead{color:var(--muted);margin:0 0 32px;max-width:36em}
.lead a{color:var(--peach);font-weight:700}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;margin-bottom:28px}
.tabs button{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 22px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--mint);color:#10233b}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;width:var(--w)}
.view[data-type="mobile"]{--w:210px;--ratio:9/19.5;--r:22px}
.view[data-type="pc"]{--w:min(100%,420px);--ratio:16/9;--r:10px}
.view[data-type="watch"]{--w:190px;--ratio:1/1;--r:30%}
.view[data-type="reactive"]{--w:min(100%,420px);--ratio:16/9;--r:10px}
.frame{aspect-ratio:var(--ratio);border-radius:var(--r);overflow:hidden;background:#0d0f22;position:relative}
.frame video,.frame img{width:100%;height:100%;object-fit:cover;display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);font-size:13px}
.name{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.dl.alt{background:transparent;color:var(--peach);border:1px solid var(--peach);padding:6px 12px}
.dl{background:var(--peach);color:#3a1a12;font-weight:700;text-decoration:none;font-size:14px;padding:7px 14px;border-radius:999px}
.spec{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:40em}
.spec dt{color:var(--muted)} .spec dd{margin:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:10px;max-width:40em}
summary{cursor:pointer;font-weight:700}
details ol{margin:10px 0 0;padding-left:20px;color:var(--muted)}
details li{margin-bottom:4px}
#termsText h3{font-size:16px;margin:24px 0 6px}
#termsText p{margin:4px 0;color:var(--muted);max-width:40em}
footer{max-width:960px;margin:0 auto;padding:20px 20px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer p{margin:4px 0;max-width:40em}
footer a{color:var(--peach);font-weight:700}
.caveat{color:var(--muted);font-size:14px;margin-top:6px;max-width:40em}

html[lang="ja"] body{font-family:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
html[lang="ja"] h1{font-family:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif}
html[lang="en"] h1{letter-spacing:-.02em}
.topbar{display:flex;justify-content:flex-end;margin-bottom:20px}
.langs{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.langs button{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.langs button[aria-pressed="true"]{background:var(--peach);color:#3a1a12;font-weight:700}
.notice{margin:0 0 24px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--peach);border-radius:10px;color:var(--muted);font-size:14px;max-width:40em}
.tabs{max-width:100%;overflow-x:auto}
.tabs button{white-space:nowrap}
@media (max-width:480px){.tabs button{padding:8px 14px}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){video{display:none}}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="langs" role="group" aria-label="Language / 언어 / 言語">
      <button type="button" data-l="ko" lang="ko">한국어</button>
      <button type="button" data-l="ja" lang="ja">日本語</button>
      <button type="button" data-l="en" lang="en">English</button>
    </div>
  </div>
  <p class="notice" id="notice" role="note" hidden></p>

  <h1 id="title">스핔이 <span>라이브 배경화면</span></h1>
  <p class="lead" id="lead">무료로 배포하는 라이브 배경화면이에요. 사용하는 기기를 골라 저장해주세요. <a href="#terms">이용약관</a>을 꼭 확인해주세요!</p>

  <div class="tabs" role="tablist" aria-label="기기 선택">
    <button role="tab" id="t-mobile" data-t="mobile">모바일</button>
    <button role="tab" id="t-pc" data-t="pc">PC</button>
    <button role="tab" id="t-watch" data-t="watch">워치</button>
    <button role="tab" id="t-reactive" data-t="reactive">반응형</button>
  </div>

  <section id="device" role="tabpanel">
    <div class="view" id="view"><div class="grid" id="grid"></div></div>
    <h2 id="specTitle">규격</h2>
    <dl class="spec" id="spec"></dl>
    <h2 id="guideTitle">설정 방법</h2>
    <div id="guides"></div>
    <p class="caveat" id="caveat">기종과 OS 버전에 따라 메뉴 이름이나 동작이 다를 수 있어요.</p>
  </section>

  <section id="terms" hidden>
    <h2 id="termsTitle">이용약관</h2>
    <div id="termsText"></div>
    <p><a href="#mobile" id="backLink" style="color:var(--peach)">배경화면으로 돌아가기</a></p>
  </section>
</main>

<footer id="credits"></footer>

const SUPPORTED = Object.keys(I18N);
const $ = id => document.getElementById(id);
let lang = "ko";
const T = () => I18N[lang];

/* 접속자 언어 판별: ?lang= → 이전에 직접 고른 언어 → 브라우저 언어 → 기본 언어 */
function detectLang(){
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
  } catch (e) {}
  try {
    const s = localStorage.getItem("lang");
    if (SUPPORTED.includes(s)) return s;
  } catch (e) {}
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  for (const l of list) {
    const p = String(l).toLowerCase().split("-")[0];
    if (SUPPORTED.includes(p)) return p;
  }
  return DEFAULT_LANG;
}

function nameOrLink(text, url){
  if (!url) return document.createTextNode(text);
  const a = document.createElement("a");
  a.href = url; a.textContent = text; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function renderCredits(){
  const t = T(), f = $("credits");
  f.textContent = "";
  const p1 = document.createElement("p");
  p1.append(t.creditOriginal, nameOrLink(t.original, ORIGINAL_URL));
  const p2 = document.createElement("p");
  p2.append(t.creditCreator, nameOrLink(t.creator, CREATOR_URL));
  const p3 = document.createElement("p");
  p3.textContent = t.creditNote(t.original);
  f.append(p1, p2, p3);
}
const tabs = [...document.querySelectorAll(".tabs button")];
const langBtns = [...document.querySelectorAll(".langs button")];

function media(file, label, frame, poster){
  const isImg = /\.(gif|png|webp)$/i.test(file);
  const el = document.createElement(isImg ? "img" : "video");
  const alt = label + T().previewSuffix;
  el.setAttribute("aria-label", alt);
  if (isImg) { el.alt = alt; }
  else { el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; if (poster) el.poster = poster; }
  el.src = file;
  el.addEventListener("error", () => {
    el.remove();
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = T().notFound;
    frame.appendChild(e);
  });
  return el;
}

function renderDevice(type){
  const t = T(), d = DEVICES[type], txt = t.devices[type];
  $("view").dataset.type = type;
  $("device").setAttribute("aria-labelledby", "t-" + type);
  tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.t === type)));

  const grid = $("grid"); grid.textContent = "";
  d.items.forEach((it, i) => {
    const name = txt.names[i];
    const card = document.createElement("div"); card.className = "card";
    const frame = document.createElement("div"); frame.className = "frame";
    frame.appendChild(media(it.preview || it.file, name, frame, it.poster || it.png));
    const row = document.createElement("div"); row.className = "name";
    const b = document.createElement("b"); b.textContent = name;
    const btns = document.createElement("div"); btns.className = "btns";
    const mk = (href, text, alt, ext) => {
      const a = document.createElement("a");
      a.className = "dl" + (alt ? " alt" : ""); a.href = href; a.textContent = text;
      if (ext) { a.target = "_blank"; a.rel = "noopener noreferrer"; } else { a.download = ""; }
      return a;
    };
    btns.append(mk(it.file, it.zip ? t.btn.download : t.btn.mp4));
    if (it.workshop) btns.append(mk(it.workshop, t.btn.workshop, true, true));
    if (it.gif) btns.append(mk(it.gif, t.btn.gif, true));
    if (it.png) btns.append(mk(it.png, t.btn.png, true));
    row.append(b, btns);
    card.append(frame, row); grid.appendChild(card);
  });

  const spec = $("spec"); spec.textContent = "";
  txt.spec.forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    spec.append(dt, dd);
  });

  const guides = $("guides"); guides.textContent = "";
  txt.guides.forEach((g, i) => {
    const det = document.createElement("details"); if (i === 0) det.open = true;
    const sum = document.createElement("summary"); sum.textContent = g.title;
    const ol = document.createElement("ol");
    g.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
    det.append(sum, ol); guides.appendChild(det);
  });
}

/* 화면 고정 문구를 현재 언어로 교체 */
function applyStaticText(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  const h1 = $("title"); h1.textContent = t.h1[0];
  const sp = document.createElement("span"); sp.textContent = t.h1[1]; h1.appendChild(sp);
  const lead = $("lead"); lead.textContent = "";
  const link = document.createElement("a"); link.href = "#terms"; link.textContent = t.lead[1];
  lead.append(t.lead[0], link, t.lead[2]);
  document.querySelector(".tabs").setAttribute("aria-label", t.tabsLabel);
  tabs.forEach(b => { b.textContent = t.tabs[b.dataset.t]; });
  $("specTitle").textContent = t.specTitle;
  $("guideTitle").textContent = t.guideTitle;
  $("caveat").textContent = t.caveat;
  $("termsTitle").textContent = t.termsTitle;
  $("backLink").textContent = t.back;
  langBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  renderCredits();
}

  const t = T();
  const h = location.hash.slice(1);
  const isTerms = h === "terms";
  $("terms").hidden = !isTerms;
  $("device").hidden = isTerms;
  document.querySelector(".tabs").hidden = isTerms;

  // 일본어·영어: 기계 번역 안내 (약관 화면에서는 한국어판 우선 문구를 추가)
  const notice = $("notice");
  const msg = t.machine ? (t.machine + (isTerms && t.termsMachine ? " " + t.termsMachine : "")) : "";
  notice.textContent = msg;
  notice.hidden = !msg;

  if (isTerms) {
    const box = $("termsText"); box.textContent = "";
    t.terms(t).forEach(([title, paras]) => {
      const h3 = document.createElement("h3"); h3.textContent = title; box.appendChild(h3);
      paras.forEach(s => { const p = document.createElement("p"); p.textContent = s; box.appendChild(p); });
    });
    return;
  }
  renderDevice(DEVICES[h] ? h : "mobile");
}

function setLang(l, save){
  lang = l;
  if (save) { try { localStorage.setItem("lang", l); } catch (e) {} }
  applyStaticText();
  route();
}

tabs.forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.t; }));
langBtns.forEach(b => b.addEventListener("click", () => setLang(b.dataset.l, true)));
window.addEventListener("hashchange", () => { route(); if (location.hash === "#terms") window.scrollTo(0, 0); });
setLang(detectLang(), false);
if (location.hash === "#terms") window.scrollTo(0, 0);

</script>
</body>
</html>
