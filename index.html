<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>스핔이 라이브 배경화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171a33; --surface:#232850; --line:#3a4080; --text:#f2f0fb; --muted:#a9acd0;
  --mint:#8fe3cf; --peach:#ffb7a5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 85% -10%,#2c3270 0,transparent 70%),var(--bg);
  color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:960px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:900;letter-spacing:-.01em;font-size:clamp(32px,7vw,54px);line-height:1.15;margin:0 0 12px}
h1 span{color:var(--mint)}
h2{font-size:18px;margin:36px 0 12px}
.lead{color:var(--muted);margin:0 0 32px;max-width:36em}
.lead a{color:var(--peach);font-weight:700}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;margin-bottom:28px}
.tabs button{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 22px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--mint);color:#10233b}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;width:var(--w)}
.view[data-type="mobile"]{--w:210px;--ratio:9/19.5;--r:22px}
.view[data-type="pc"]{--w:min(100%,420px);--ratio:16/9;--r:10px}
.view[data-type="watch"]{--w:190px;--ratio:1/1;--r:30%}
.frame{aspect-ratio:var(--ratio);border-radius:var(--r);overflow:hidden;background:#0d0f22;position:relative}
.frame video,.frame img{width:100%;height:100%;object-fit:cover;display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);font-size:13px}
.name{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.dl.alt{background:transparent;color:var(--peach);border:1px solid var(--peach);padding:6px 12px}
.dl{background:var(--peach);color:#3a1a12;font-weight:700;text-decoration:none;font-size:14px;padding:7px 14px;border-radius:999px}
.spec{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:40em}
.spec dt{color:var(--muted)} .spec dd{margin:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:10px;max-width:40em}
summary{cursor:pointer;font-weight:700}
details ol{margin:10px 0 0;padding-left:20px;color:var(--muted)}
details li{margin-bottom:4px}
#termsText h3{font-size:16px;margin:24px 0 6px}
#termsText p{margin:4px 0;color:var(--muted);max-width:40em}
footer{max-width:960px;margin:0 auto;padding:20px 20px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer p{margin:4px 0;max-width:40em}
footer a{color:var(--peach);font-weight:700}
.caveat{color:var(--muted);font-size:14px;margin-top:6px;max-width:40em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){video{display:none}}
</style>
</head>
<body>
<main>
  <h1>스핔이 <span>라이브 배경화면</span></h1>
  <p class="lead">무료로 배포하는 라이브 배경화면이에요. 사용하는 기기를 골라 저장해주세요. <a href="#terms">이용약관</a>을 꼭 확인해주세요!</p>

  <div class="tabs" role="tablist" aria-label="기기 선택">
    <button role="tab" id="t-mobile" data-t="mobile">모바일</button>
    <button role="tab" id="t-pc" data-t="pc">PC</button>
    <button role="tab" id="t-watch" data-t="watch">워치</button>
  </div>

  <section id="device" role="tabpanel">
    <div class="view" id="view"><div class="grid" id="grid"></div></div>
    <h2>규격</h2>
    <dl class="spec" id="spec"></dl>
    <h2>설정 방법</h2>
    <div id="guides"></div>
    <p class="caveat">기종과 OS 버전에 따라 메뉴 이름이나 동작이 다를 수 있어요.</p>
  </section>

  <section id="terms" hidden>
    <h2>이용약관</h2>
    <div id="termsText"></div>
    <p><a href="#mobile" style="color:var(--peach)">배경화면으로 돌아가기</a></p>
  </section>
</main>

<footer id="credits"></footer>

<script>

const DEVICES = {

    guides: [

      ]}
    ]
  },
  pc: {
    items: [
      { name: "쪼아요", file: "assets/pc/joayo.mp4", png: "assets/pc/joayo.png" },

    ],

/* ▲ */

const $ = id => document.getElementById(id);

function nameOrLink(text, url){
  if (!url) return document.createTextNode(text);
  const a = document.createElement("a");
  a.href = url; a.textContent = text; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
(function renderCredits(){
  const f = $("credits");
  const p1 = document.createElement("p");
  p1.append("원작: ", nameOrLink(ORIGINAL, ORIGINAL_URL));
  const p2 = document.createElement("p");
  p2.append("제작: ", nameOrLink(CREATOR_NAME, CREATOR_URL));
  const p3 = document.createElement("p");
  p3.textContent = "이 사이트의 배경화면은 " + ORIGINAL + "을(를) 바탕으로 제작한 비공식 팬 제작물이며, 원작의 저작권은 원작 권리자에게 있습니다.";
  f.append(p1, p2, p3);
})();
const tabs = [...document.querySelectorAll(".tabs button")];

function media(file, label, frame, poster){
  const isImg = /\.(gif|png|webp)$/i.test(file);
  const el = document.createElement(isImg ? "img" : "video");
  el.setAttribute("aria-label", label + " 미리보기");
  if (isImg) { el.alt = label + " 미리보기"; }
  else { el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; if (poster) el.poster = poster; }
  el.src = file;
  el.addEventListener("error", () => {
    el.remove();
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "파일을 찾을 수 없어요";
    frame.appendChild(e);
  });
  return el;
}

function renderDevice(type){
  const d = DEVICES[type];
  $("view").dataset.type = type;
  $("device").setAttribute("aria-labelledby", "t-" + type);
  tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.t === type)));

  const grid = $("grid"); grid.textContent = "";
  d.items.forEach(it => {
    const card = document.createElement("div"); card.className = "card";
    const frame = document.createElement("div"); frame.className = "frame";
    frame.appendChild(media(it.file, it.name, frame, it.png));
    const row = document.createElement("div"); row.className = "name";
    const b = document.createElement("b"); b.textContent = it.name;
    const btns = document.createElement("div"); btns.className = "btns";
    const mk = (href, text, alt) => {
      const a = document.createElement("a");
      a.className = "dl" + (alt ? " alt" : ""); a.href = href; a.download = ""; a.textContent = text;
      return a;
    };
    btns.append(mk(it.file, "MP4 저장"));
    if (it.gif) btns.append(mk(it.gif, "GIF 저장", true));
    if (it.png) btns.append(mk(it.png, "PNG 저장", true));
    row.append(b, btns);
    card.append(frame, row); grid.appendChild(card);
  });

  const spec = $("spec"); spec.textContent = "";
  d.spec.forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    spec.append(dt, dd);
  });

  const guides = $("guides"); guides.textContent = "";
  d.guides.forEach((g, i) => {
    const det = document.createElement("details"); if (i === 0) det.open = true;
    const sum = document.createElement("summary"); sum.textContent = g.title;
    const ol = document.createElement("ol");
    g.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
    det.append(sum, ol); guides.appendChild(det);
  });
}

function route(){
  const h = location.hash.slice(1);
  const isTerms = h === "terms";
  $("terms").hidden = !isTerms;
  $("device").hidden = isTerms;
  document.querySelector(".tabs").hidden = isTerms;
  if (isTerms) {
    const box = $("termsText"); box.textContent = "";
    TERMS.forEach(([title, paras]) => {
      const h = document.createElement("h3"); h.textContent = title; box.appendChild(h);
      paras.forEach(t => { const p = document.createElement("p"); p.textContent = t; box.appendChild(p); });
    });
    window.scrollTo(0, 0);
    return;
  }
  renderDevice(DEVICES[h] ? h : "mobile");
}
tabs.forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.t; }));
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
